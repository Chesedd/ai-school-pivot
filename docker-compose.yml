services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_ECHO: ${DATABASE_ECHO:-false}
      CONTENT_BANK_DEV_ACTOR_ID: ${CONTENT_BANK_DEV_ACTOR_ID}
      ASSESSMENT_DEV_STUDENT_ID: ${ASSESSMENT_DEV_STUDENT_ID:-00000000-0000-4000-8000-000000000002}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      AUTH_SESSION_TTL: ${AUTH_SESSION_TTL:-PT12H}
      ATTACHMENT_STORAGE_PATH: /data/attachments
      ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES:-5242880}
      ARTIFACT_STORAGE_PATH: /data/image-artifacts
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      IMAGE_SOLVING_ANTHROPIC_MODEL: ${IMAGE_SOLVING_ANTHROPIC_MODEL:-claude-sonnet-4-6}
    volumes:
      - attachment_data:/data/attachments
      - image_artifact_data:/data/image-artifacts
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT}:5173"

volumes:
  postgres_data:
  attachment_data:
  image_artifact_data:
