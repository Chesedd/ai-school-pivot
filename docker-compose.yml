services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_ECHO: ${DATABASE_ECHO:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      AUTH_SESSION_TTL: ${AUTH_SESSION_TTL:-PT12H}
      AUTH_SESSION_COOKIE_NAME: ${AUTH_SESSION_COOKIE_NAME:-ai_school_session}
      AUTH_SESSION_COOKIE_SECURE: ${AUTH_SESSION_COOKIE_SECURE:-false}
      AUTH_SESSION_COOKIE_SAMESITE: ${AUTH_SESSION_COOKIE_SAMESITE:-lax}
      ATTACHMENT_STORAGE_PATH: /data/attachments
      ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES:-5242880}
      ARTIFACT_STORAGE_PATH: /data/image-artifacts
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      IMAGE_SOLVING_ANTHROPIC_MODEL: ${IMAGE_SOLVING_ANTHROPIC_MODEL:-claude-sonnet-4-6}
      PAPER_MAX_ARTIFACTS_PER_BATCH: ${PAPER_MAX_ARTIFACTS_PER_BATCH:-25}
      PAPER_MAX_TOTAL_UPLOAD_BYTES_PER_BATCH: ${PAPER_MAX_TOTAL_UPLOAD_BYTES_PER_BATCH:-262144000}
      PAPER_MAX_SINGLE_ARTIFACT_BYTES: ${PAPER_MAX_SINGLE_ARTIFACT_BYTES:-26214400}
      PAPER_MAX_PAGES_PER_ARTIFACT: ${PAPER_MAX_PAGES_PER_ARTIFACT:-100}
      PAPER_MAX_PAGES_PER_BATCH: ${PAPER_MAX_PAGES_PER_BATCH:-150}
      PAPER_MAX_PIXELS_PER_PAGE: ${PAPER_MAX_PIXELS_PER_PAGE:-25000000}
      PAPER_MAX_PAPER_SUBMISSIONS_PER_BATCH: ${PAPER_MAX_PAPER_SUBMISSIONS_PER_BATCH:-60}
      PAPER_MAX_PAGES_PER_PAPER: ${PAPER_MAX_PAGES_PER_PAPER:-20}
      PAPER_MAX_PARALLEL_MATCHING_RUNS: ${PAPER_MAX_PARALLEL_MATCHING_RUNS:-1}
      PAPER_MAX_PARALLEL_PAPER_CHECKS_PER_BATCH: ${PAPER_MAX_PARALLEL_PAPER_CHECKS_PER_BATCH:-3}
      PAPER_MAX_PARALLEL_PAPER_CHECKS_GLOBAL: ${PAPER_MAX_PARALLEL_PAPER_CHECKS_GLOBAL:-12}
      PAPER_MAX_PROVIDER_PAGES_PER_PAPER: ${PAPER_MAX_PROVIDER_PAGES_PER_PAPER:-20}
      PAPER_MAX_PROVIDER_IMAGE_BYTES_PER_PAPER: ${PAPER_MAX_PROVIDER_IMAGE_BYTES_PER_PAPER:-26214400}
      PAPER_EXECUTION_LEASE_SECONDS: ${PAPER_EXECUTION_LEASE_SECONDS:-120}
      PAPER_SOURCE_RETENTION_DAYS: ${PAPER_SOURCE_RETENTION_DAYS:-30}
      PAPER_UNPUBLISHED_PAGE_RETENTION_DAYS: ${PAPER_UNPUBLISHED_PAGE_RETENTION_DAYS:-30}
      PAPER_WITHDRAWAL_PAGE_GRACE_DAYS: ${PAPER_WITHDRAWAL_PAGE_GRACE_DAYS:-30}
      PAPER_RETENTION_MAX_TARGETS_PER_RUN: ${PAPER_RETENTION_MAX_TARGETS_PER_RUN:-100}
      PAPER_RETENTION_CLAIM_TTL_SECONDS: ${PAPER_RETENTION_CLAIM_TTL_SECONDS:-300}
    volumes:
      - attachment_data:/data/attachments
      - image_artifact_data:/data/image-artifacts
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT}:5173"

volumes:
  postgres_data:
  attachment_data:
  image_artifact_data:
